name: Release

# Push a tag v<VERSION> (scripts/release.ps1 makes it) to build the Docker
# image (linux/amd64 + linux/arm64) and publish a GitHub release. Versions
# with a suffix (0.2.0-beta.1) are published as pre-releases and do not move
# the `latest` / MAJOR.MINOR image tags.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (pinned common)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      common: ${{ steps.version.outputs.common }}
    steps:
      - name: Check out server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: server
          persist-credentials: false

      - name: Check tag matches VERSION
        id: version
        run: |
          version="$(tr -d '\r\n' < server/VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          ref="$(tr -d '\r\n' < server/COMMON_REF 2>/dev/null || echo main)"
          echo "common: $ref"
          echo "common=${ref}" >> "$GITHUB_OUTPUT"

      - name: Check out common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/NyaPassword-common
          # read-only deploy key of the (private) common repository
          ssh-key: ${{ secrets.COMMON_DEPLOY_KEY }}
          ref: ${{ steps.version.outputs.common }}
          path: common
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - name: Test
        working-directory: server
        run: cargo test --locked

  image:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: server
          persist-credentials: false

      - name: Check out common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/NyaPassword-common
          # read-only deploy key of the (private) common repository
          ssh-key: ${{ secrets.COMMON_DEPLOY_KEY }}
          ref: ${{ needs.test.outputs.common }}
          path: common
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nyapassword-server" >> "$GITHUB_OUTPUT"

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.test.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.test.outputs.version }},enable=${{ needs.test.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.test.outputs.prerelease == 'false' }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish GitHub release
    needs: [test, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: server
          persist-credentials: false

      - name: Deployment files
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          mkdir -p dist
          name="NyaPassword-Server-deploy_${VERSION}.tar.gz"
          tar -C server -czf "dist/$name" deploy
          (cd dist && sha256sum "$name" > SHA256SUMS)

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: NyaPassword Server ${{ github.ref_name }}
          prerelease: ${{ needs.test.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*
