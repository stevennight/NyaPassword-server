name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workspace mirrors the local layout: server/ and common/ (latest main;
# a release pins it with COMMON_REF instead) side by side.
jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out server
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: server
          persist-credentials: false

      - name: Check out common
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository_owner }}/NyaPassword-common
          # read-only deploy key of the (private) common repository
          ssh-key: ${{ secrets.COMMON_DEPLOY_KEY }}
          path: common
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: server -> ../target

      - name: Check version
        working-directory: server
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          grep -q "^version = \"$version\"" Cargo.toml || { echo "Cargo.toml version differs from VERSION $version" >&2; exit 1; }

      - name: Test
        working-directory: server
        # Not --locked: common main may be ahead of this Cargo.lock (releases build with --locked).
        run: cargo test

  docker:
    name: Docker image (amd64, smoke test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out server
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: server
          persist-credentials: false

      - name: Check out common
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository_owner }}/NyaPassword-common
          # read-only deploy key of the (private) common repository
          ssh-key: ${{ secrets.COMMON_DEPLOY_KEY }}
          path: common
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: nyapassword-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm nyapassword-server:ci nyapassword-server --version
          docker run -d --name npw -p 18087:8087 nyapassword-server:ci
          for i in $(seq 1 30); do
            if docker exec npw nyapassword-server --healthcheck; then break; fi
            sleep 1
          done
          docker exec npw nyapassword-server --healthcheck
          curl -fsS http://127.0.0.1:18087/v1/server-info
          docker rm -f npw
