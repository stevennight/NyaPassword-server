# NyaPassword server. Copy .env.example to .env, set VERSION, then:
#   docker compose up -d
# Caddy (deploy/caddy/Caddyfile) terminates TLS and proxies to 127.0.0.1:8087.
name: ${NYAPASSWORD_PROJECT:-nyapassword}

services:
  nyapassword:
    image: "${IMAGE:-ghcr.io/example/nyapassword-server}:${VERSION:?set VERSION in .env}"
    restart: unless-stopped
    network_mode: host
    environment:
      NYAPASSWORD_LISTEN: ${LISTEN:-127.0.0.1:8087}
      NYAPASSWORD_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NYAPASSWORD_LOG: ${LOG:-info}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
